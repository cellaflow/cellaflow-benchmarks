# The only service this benchmark needs. The `skyvern-shaped` arm has no
# dependencies at all -- it is plain Python reproducing an ordering -- so the
# engine is here solely for the `cellaflow` arm.
services:
  cellaflow:
    image: ghcr.io/cellaflow/cellaflow:latest
    environment:
      CELLAFLOW_HOST: "::"
      CELLAFLOW_DB_PATH: /data/cellaflow
    ports: ["50051:50051", "9090:9090"]
